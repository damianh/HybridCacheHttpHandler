name: hybrid-cache-handler/checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '**'
    paths:
      - .github/workflows/hybrid-cache-handler-checks.yml
      - hybrid-cache-handler/**
      - Directory.Build.props
      - global.json
      - http-lib.slnx
  pull_request:
    paths:
      - .github/workflows/hybrid-cache-handler-checks.yml
      - hybrid-cache-handler/**
      - Directory.Build.props
      - global.json
      - http-lib.slnx

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks
        run: |
          cd hybrid-cache-handler/benchmarks/Benchmarks
          dotnet run --project Benchmarks.csproj --configuration Release -- --exporters json
        continue-on-error: true

      - name: Add benchmark results to summary
        if: always()
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "hybrid-cache-handler/benchmarks/Benchmarks/BenchmarkDotNet.Artifacts/results/Benchmarks-report.json" ]; then
            echo "Benchmark completed successfully. Full results available in artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "Benchmark execution completed with warnings or errors." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: hybrid-cache-handler/benchmarks/Benchmarks/BenchmarkDotNet.Artifacts/
          if-no-files-found: ignore

  cache-conformance:
    name: RFC 9111 conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run RFC 9111 conformance suite
        run: ./hybrid-cache-handler/conformance/run-conformance.sh

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-conformance-results
          path: hybrid-cache-handler/conformance/results.json
          if-no-files-found: ignore
